[build]
  command = "npm --prefix dashboard install && npm --prefix dashboard run build"
  publish = "dashboard/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
